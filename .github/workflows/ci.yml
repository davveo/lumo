name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: sh scripts/test-frontend.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build:web
      - run: make format-tools format-check

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.4
        env:
          MYSQL_ROOT_PASSWORD: ci-scratch-mysql
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      rabbitmq:
        image: rabbitmq:4.0.7-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci-user
          RABBITMQ_DEFAULT_PASS: ci-scratch-rabbit
        ports: ['5672:5672', '15672:15672']
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      GOWORK: 'off'
      MYSQL_ROOT_PASSWORD: ci-scratch-mysql
      LUMO_MYSQL_ADMIN_TEST: '1'
      LUMO_MYSQL_SEARCH_TEST: '1'
      LUMO_MYSQL_PROJECTION_TEST: '1'
      LUMO_AMQP_TEST: '1'
      LUMO_TEST_AMQP_URL: amqp://ci-user:ci-scratch-rabbit@127.0.0.1:5672/
      LUMO_AMQP_MANAGEMENT_URL: http://127.0.0.1:15672
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
      - run: go test -count=1 ./internal/platform ./services/catalog/internal/repository ./tests
      - run: docker build -f web/Dockerfile -t lumo-ci-web:ci web
      - run: LUMO_TEST_WEB_IMAGE=lumo-ci-web:ci python3 -m unittest discover -s tests -p test_web_proxy.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: sh scripts/test-browser.sh
